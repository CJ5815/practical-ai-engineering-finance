[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-finance-course"
version = "0.1.0"
description = "Starter code for Practical AI Engineering for Finance"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "polars>=1.0",
    "openpyxl>=3.1",
    "duckdb>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "networkx>=3.3",
]

[project.scripts]
sec-thesis = "sec_thesis.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "formulas>=1.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
rag = [
    "chromadb>=0.5",
    # Pinned together deliberately: recent sentence-transformers/transformers
    # releases require torch>=2.4, but PyTorch stopped publishing Intel-macOS
    # wheels after 2.2.2 (and 2.2.2 has no Python 3.13 build at all). This
    # combination is the newest one verified to actually import and run —
    # on an Intel Mac, also use Python 3.11 or 3.12 for this extra (see
    # Week 8's lesson for the full explanation).
    "sentence-transformers>=3.0,<5",
    "transformers<5",
    "torch==2.2.2",
    "numpy<2",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
